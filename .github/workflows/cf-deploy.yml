name: Deploy to Cloudflare Workers

# 触发方式：
#  1) Fork Sync 跑完（上游有新提交时自动跟随）
#  2) 每天 UTC 00:40（北京 08:40）兜底
#  3) 手动改代码 push 到 main
#  4) 随时可在 Actions 页面手动点
on:
  schedule:
    - cron: "40 0 * * *"
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "Fork Sync" ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
        run: npx --yes wrangler@4 deploy

      - name: Verify live version
        run: |
          sleep 15
          echo "--- 线上 /api/config 前 300 字符 ---"
          curl -s https://danmu-api.276713916.workers.dev/api/config | head -c 300
          echo
          echo "--- 仓库代码里的版本号 ---"
          grep -n "VERSION:" danmu_api/configs/globals.js
          echo "--- 搜索接口自检 ---"
          curl -s -m 20 "https://danmu-api.276713916.workers.dev/87654321/api/v2/search/anime?keyword=test" | head -c 120
          echo
