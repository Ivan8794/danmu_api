name: Deploy to Cloudflare Workers

on:
  schedule:
    - cron: "40 0 * * *"
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "Fork Sync" ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Cloudflare Workers 禁止在全局作用域调用 crypto.randomUUID / Math.random。
      # 上游 1.22.0 在 pipeline-trace.js 顶层生成 nonce，会被 CF 校验拒绝（error 10021）。
      # 这里在部署前改成惰性生成，上游修好后本步骤自动跳过。
      - name: Patch global-scope random for Workers
        run: |
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("danmu_api/utils/pipeline-trace.js")
          if not p.exists():
              print("patch: file absent, skip")
              sys.exit(0)
          s = p.read_text(encoding="utf-8")
          if "TRACE_BOOT_NONCE" not in s:
              print("patch: nothing to do (already fixed or upstream changed)")
              sys.exit(0)
          old = ("const TRACE_BOOT_NONCE = globalThis.crypto?.randomUUID?.()\n"
                 "  || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;")
          new = ("// Cloudflare Workers 禁止在全局作用域生成随机值，改为首次使用时惰性生成\n"
                 "let traceBootNonceCache = '';\n"
                 "function getBootNonce() {\n"
                 "  if (!traceBootNonceCache) {\n"
                 "    traceBootNonceCache = globalThis.crypto?.randomUUID?.()\n"
                 "      || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;\n"
                 "  }\n"
                 "  return traceBootNonceCache;\n"
                 "}")
          if old in s:
              s = s.replace(old, new)
          else:
              print("patch: anchor shape changed, attempting loose replace")
          s = s.replace("${TRACE_BOOT_NONCE}-${++traceSeq}", "${getBootNonce()}-${++traceSeq}")
          s = s.replace("TRACE_BOOT_NONCE", "getBootNonce()")
          p.write_text(s, encoding="utf-8")
          print("patch: applied")
          PY

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
        run: npx --yes wrangler@4 deploy

      - name: Verify live version
        run: |
          sleep 15
          echo "--- 线上 /api/config ---"
          curl -s -m 20 https://danmu-api.276713916.workers.dev/api/config | head -c 200
          echo
          echo "--- 仓库代码版本 ---"
          grep -n "VERSION:" danmu_api/configs/globals.js
          echo "--- 搜索接口自检 ---"
          curl -sG -m 30 "https://danmu-api.276713916.workers.dev/87654321/api/v2/search/anime" \
            --data-urlencode "keyword=进击的巨人" | head -c 200
          echo
