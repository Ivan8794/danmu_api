name: API Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe API
        run: |
          B="https://danmu-api.276713916.workers.dev/87654321"
          echo "--- 1. 搜索 进击的巨人 ---"
          curl -sG -m 40 "$B/api/v2/search/anime" --data-urlencode "keyword=进击的巨人" | head -c 700; echo
          echo "--- 2. 搜索 斗罗大陆 ---"
          curl -sG -m 40 "$B/api/v2/search/anime" --data-urlencode "keyword=斗罗大陆" | head -c 400; echo
          echo "--- 3. 集数 ---"
          curl -sG -m 40 "$B/api/v2/search/episodes" --data-urlencode "anime=进击的巨人" --data-urlencode "episode=1" | head -c 500; echo
          echo "--- 4. 弹幕拉取 ---"
          curl -sG -m 40 "$B/api/v2/danmaku/qq?name=进击的巨人" --data-urlencode "episode=1" | head -c 400; echo
